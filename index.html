<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e8">
<title>えいごトーク！</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --text:#49392f;
  --sub:#75665d;
  --paper:#fffdf8;
  --line:#dfcdb8;

  --green:#bce9cd;
  --green2:#57966e;

  --blue:#d6eef8;
  --blue2:#588fa7;

  --pink:#f6d3de;
  --pink2:#aa6579;

  --yellow:#f6dfa0;

  --nav:84px;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color:var(--text);

  background:#f3efe5;

  font-size:17px;

  -webkit-text-size-adjust:100%;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

button:disabled{
  opacity:.55;
}

#app{
  width:100%;
  max-width:480px;

  min-height:100dvh;

  margin:auto;

  background:
    linear-gradient(
      180deg,
      #fff8e6 0%,
      #e8f7f1 63%,
      #f5efe4 100%
    );

  position:relative;
}


/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;

  z-index:100;

  min-height:66px;

  padding:
    calc(
      8px +
      env(safe-area-inset-top)
    )
    13px
    8px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    rgba(
      255,
      250,
      239,
      .97
    );

  border-bottom:
    2px solid
    rgba(
      90,
      65,
      47,
      .12
    );
}

.brand{
  display:flex;
  align-items:center;

  gap:8px;

  font-size:21px;
  font-weight:900;
}

.brandIcon{
  font-size:34px;
}

.headerRight{
  display:flex;
  gap:7px;
}

.headerBtn{
  min-height:44px;
  min-width:48px;

  padding:
    6px
    11px;

  border:
    2px solid #e2cfb9;

  border-radius:999px;

  background:white;

  color:var(--text);

  font-weight:900;
}


/* =====================================================
   MAIN
===================================================== */

main{
  padding:
    14px
    13px
    calc(
      var(--nav) +
      28px +
      env(safe-area-inset-bottom)
    );
}

.card{
  width:100%;

  margin-bottom:14px;

  padding:
    20px
    16px;

  border:
    3px solid var(--line);

  border-radius:27px;

  background:
    rgba(
      255,
      253,
      248,
      .98
    );

  box-shadow:
    0 5px 0
    rgba(
      88,
      64,
      45,
      .10
    );
}

.center{
  text-align:center;
}

.bigEmoji{
  font-size:78px;
  line-height:1.15;
}

.lessonEmoji{
  font-size:68px;
  line-height:1.15;
}

.title{
  margin:
    9px
    0
    7px;

  font-size:27px;
  font-weight:900;

  line-height:1.35;
}

.sub{
  color:var(--sub);

  font-size:16px;
  font-weight:700;

  line-height:1.6;
}

.english{
  margin:
    18px
    0
    6px;

  color:#28627f;

  font-size:41px;
  font-weight:900;

  line-height:1.15;
}

.japanese{
  margin-bottom:14px;

  color:var(--sub);

  font-size:21px;
  font-weight:900;
}

.prompt{
  margin:
    17px
    0;

  padding:17px;

  border:
    3px solid #d0aa4f;

  border-radius:22px;

  background:#fff0ba;

  font-size:22px;
  font-weight:900;

  line-height:1.5;
}


/* =====================================================
   BUTTONS
===================================================== */

.primary,
.secondary,
.plain{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  font-weight:900;
}

.primary{
  min-height:68px;

  margin-top:15px;

  border:
    3px solid var(--green2);

  border-radius:22px;

  background:var(--green);

  color:#31553e;

  box-shadow:
    0 5px 0 #77b48a;

  font-size:20px;
}

.secondary{
  min-height:61px;

  margin-top:11px;

  border:
    3px solid var(--blue2);

  border-radius:21px;

  background:var(--blue);

  color:#315a70;

  font-size:19px;
}

.plain{
  min-height:57px;

  margin-top:10px;

  border:
    3px solid #dbc8b5;

  border-radius:20px;

  background:white;

  color:var(--text);

  font-size:17px;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;

  margin-bottom:15px;
}

.stat{
  padding:
    15px
    8px;

  border:
    3px solid #876955;

  border-radius:24px;

  background:white;

  text-align:center;
}

.statIcon{
  font-size:33px;
}

.statValue{
  font-size:37px;
  font-weight:900;
}

.statLabel{
  color:var(--sub);

  font-size:14px;
  font-weight:900;
}


/* =====================================================
   MENU
===================================================== */

.menu{
  display:grid;
  gap:11px;
}

.menuBtn{
  width:100%;

  min-height:93px;

  padding:12px;

  display:grid;

  grid-template-columns:
    58px
    minmax(0,1fr)
    20px;

  gap:10px;

  align-items:center;

  border:
    3px solid #dac8b7;

  border-radius:23px;

  background:white;

  text-align:left;
}

.menuIcon{
  width:56px;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:#fff0c7;

  font-size:32px;
}

.menuTitle{
  font-size:19px;
  font-weight:900;
}

.menuText{
  margin-top:3px;

  color:var(--sub);

  font-size:14px;
  font-weight:700;
}

.arrow{
  font-size:28px;
  color:#9e8878;
}


/* =====================================================
   TRAINING
===================================================== */

.training{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;
}

.trainingBtn{
  min-height:144px;

  padding:
    14px
    8px;

  border:
    3px solid #dbc8b6;

  border-radius:24px;

  background:white;

  text-align:center;
}

.trainingIcon{
  font-size:50px;
}

.trainingTitle{
  margin-top:5px;

  font-size:19px;
  font-weight:900;
}

.trainingText{
  margin-top:3px;

  color:var(--sub);

  font-size:13px;
  font-weight:700;
}


/* =====================================================
   PROGRESS
===================================================== */

.progressCard{
  margin-bottom:13px;

  padding:
    12px
    14px;

  border:
    3px solid
    rgba(
      100,
      70,
      50,
      .17
    );

  border-radius:20px;

  background:
    rgba(
      255,
      253,
      248,
      .98
    );
}

.progress{
  height:13px;

  overflow:hidden;

  border-radius:999px;

  background:#e7ddd2;
}

.progressFill{
  height:100%;

  background:
    linear-gradient(
      90deg,
      #efc64e,
      #e9a5b7
    );
}

.progressText{
  margin-top:5px;

  text-align:right;

  color:var(--sub);

  font-size:14px;
  font-weight:900;
}


/* =====================================================
   MIC
===================================================== */

.micArea{
  margin:
    23px
    0
    15px;

  text-align:center;
}

.mic{
  width:134px;
  height:134px;

  border:
    4px solid var(--pink2);

  border-radius:50%;

  background:var(--pink);

  box-shadow:
    0 8px 0 #c57e92;

  font-size:63px;
}

.mic.listening{
  animation:
    pulse
    .6s
    infinite
    alternate;
}

.mic.preparing{
  animation:
    pulse
    .9s
    infinite
    alternate;

  background:#f7e5b8;
}

@keyframes pulse{
  to{
    transform:
      scale(1.07);
  }
}

.micText{
  margin-top:13px;

  color:var(--sub);

  font-size:16px;
  font-weight:900;
}

.voiceResult{
  min-height:84px;

  margin-top:14px;

  padding:13px;

  border:
    3px solid #b8dce9;

  border-radius:20px;

  background:#effaff;

  color:#416a7c;

  font-weight:800;

  text-align:center;
}

.feedback{
  display:none;

  margin-top:12px;

  padding:13px;

  border-radius:18px;

  font-size:16px;
  font-weight:900;
}

.feedback.good{
  display:block;

  background:#e1f5e8;

  border:
    2px solid #96d2aa;

  color:#315d40;
}

.feedback.retry{
  display:block;

  background:#fff0d4;

  border:
    2px solid #e2bd74;

  color:#76501e;
}


/* =====================================================
   QUIZ
===================================================== */

.choices{
  display:grid;

  gap:11px;

  margin-top:15px;
}

.choice{
  min-height:73px;

  padding:11px;

  border:
    3px solid #80b2c8;

  border-radius:21px;

  background:#edf9fd;

  color:#315d74;

  font-size:21px;
  font-weight:900;
}


/* =====================================================
   FALLBACK
===================================================== */

.fallback{
  display:none;

  margin-top:10px;

  padding:12px;

  border:
    2px dashed #c9a973;

  border-radius:17px;

  background:#fff9e9;
}

.fallback.show{
  display:block;
}

.fallbackText{
  font-size:14px;

  color:#776351;

  font-weight:700;

  line-height:1.5;
}


/* =====================================================
   NAV
===================================================== */

nav{
  position:fixed;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  z-index:200;

  width:100%;
  max-width:480px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:4px;

  padding:
    6px
    6px
    calc(
      6px +
      env(safe-area-inset-bottom)
    );

  border-top:
    2px solid #dfcdb9;

  background:
    rgba(
      255,
      250,
      240,
      .99
    );
}

.navBtn{
  min-height:72px;

  border-radius:18px;

  background:transparent;

  color:#65574e;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  font-size:12px;
  font-weight:900;
}

.navIcon{
  font-size:28px;
}

.navBtn.active{
  background:#f6e3a1;

  color:#714e18;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
  display:none;

  position:fixed;
  inset:0;

  z-index:1000;

  padding:14px;

  background:
    rgba(
      48,
      37,
      30,
      .54
    );

  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:420px;

  padding:
    22px
    16px;

  border:
    4px solid #896854;

  border-radius:27px;

  background:#fffdf8;

  text-align:center;
}

.field{
  width:100%;

  min-height:58px;

  margin:
    7px
    0;

  padding:12px;

  border:
    3px solid #d8c5b2;

  border-radius:17px;

  background:white;

  font-size:18px;
  font-weight:800;
}

.notice{
  margin-top:12px;

  padding:13px;

  border-radius:18px;

  background:#eef9fd;

  color:#426776;

  text-align:left;

  font-size:14px;
  font-weight:700;

  line-height:1.65;
}


/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      var(--nav) +
      23px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  z-index:2000;

  width:
    calc(
      100% -
      30px
    );

  max-width:410px;

  padding:12px;

  border-radius:17px;

  background:
    rgba(
      65,
      51,
      42,
      .95
    );

  color:white;

  text-align:center;

  font-size:15px;
  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .18s;
}

#toast.show{
  opacity:1;
}
</style>
</head>


<body>

<div id="app">

<header>

  <div class="brand">

    <span class="brandIcon">
      🐥
    </span>

    <span>
      えいごトーク！
    </span>

  </div>


  <div class="headerRight">

    <button
      id="gradeBtn"
      class="headerBtn"
      onclick="openProfile()"
    >
      1ねん
    </button>

    <button
      class="headerBtn"
      onclick="openProfile()"
    >
      🙂
    </button>

  </div>

</header>


<main id="screen"></main>


<nav>

  <button
    id="navHome"
    class="navBtn active"
    onclick="go('home')"
  >
    <span class="navIcon">
      🏠
    </span>

    きょう
  </button>


  <button
    id="navTrain"
    class="navBtn"
    onclick="go('train')"
  >
    <span class="navIcon">
      🎧
    </span>

    れんしゅう
  </button>


  <button
    id="navTalk"
    class="navBtn"
    onclick="go('talk')"
  >
    <span class="navIcon">
      💬
    </span>

    かいわ
  </button>


  <button
    id="navReward"
    class="navBtn"
    onclick="go('reward')"
  >
    <span class="navIcon">
      🎁
    </span>

    ごほうび
  </button>

</nav>

</div>


<div id="toast"></div>


<div
  id="profileModal"
  class="modal"
>

  <div class="modalBox">

    <div class="bigEmoji">
      🙂
    </div>

    <div class="title">
      プレイヤー
    </div>

    <input
      id="nameInput"
      class="field"
      maxlength="20"
      placeholder="ニックネーム"
    >

    <select
      id="gradeInput"
      class="field"
    >
      <option value="1">
        1ねん
      </option>

      <option value="2">
        2ねん
      </option>

      <option value="3">
        3ねん
      </option>

      <option value="4">
        4ねん
      </option>
    </select>

    <button
      class="primary"
      onclick="saveProfile()"
    >
      ✓ ほぞん
    </button>

    <button
      class="plain"
      onclick="
        closeModal(
          'profileModal'
        )
      "
    >
      とじる
    </button>

  </div>

</div>


<div
  id="micHelpModal"
  class="modal"
>

  <div class="modalBox">

    <div class="bigEmoji">
      🎤
    </div>

    <div class="title">
      マイクについて
    </div>

    <div
      id="micHelpText"
      class="notice"
    ></div>

    <button
      class="primary"
      onclick="
        closeModal(
          'micHelpModal'
        )
      "
    >
      わかった
    </button>

  </div>

</div>

/* ======================================================

====================================================== */

function boot() {

  loadState();

  updateHeader();

  go(
    'home'
  );

}


function loadState() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          'eigoTalkState'
        ) ||
        '{}'
      );


    state = {
      ...state,
      ...saved,

      recognition:
        null,

      listening:
        false,

      micPreparing:
        false,

      micFailures:
        0
    };

  }

  catch (error) {}

}


function saveState() {

  const copy = {
    ...state
  };


  delete copy.recognition;

  delete copy.listening;

  delete copy.micPreparing;

  delete copy.micFailures;


  localStorage.setItem(
    'eigoTalkState',
    JSON.stringify(
      copy
    )
  );

}


function updateHeader() {

  document
    .getElementById(
      'gradeBtn'
    )
    .textContent =
      state.grade +
      'ねん';

}


/* ======================================================
   NAVIGATION
====================================================== */

function go(
  page
) {

  stopRecognition();


  state.page =
    page;


  saveState();


  document
    .querySelectorAll(
      '.navBtn'
    )
    .forEach(
      element => {

        element
          .classList
          .remove(
            'active'
          );

      }
    );


  const ids = {

    home:
      'navHome',

    train:
      'navTrain',

    talk:
      'navTalk',

    reward:
      'navReward'

  };


  if (
    ids[
      page
    ]
  ) {

    document
      .getElementById(
        ids[
          page
        ]
      )
      .classList
      .add(
        'active'
      );

  }


  window.scrollTo(
    0,
    0
  );


  if (
    page ===
    'home'
  ) {

    renderHome();

  }


  if (
    page ===
    'train'
  ) {

    renderTraining();

  }


  if (
    page ===
    'talk'
  ) {

    renderMissionList();

  }


  if (
    page ===
    'reward'
  ) {

    renderReward();

  }

}

/* ======================================================

====================================================== */

function getProblems() {

  const rows =
    WORDS[
      state.grade
    ] || [];


  return rows.map(
    (
      row,
      index
    ) => {

      if (
        state.grade ===
        4
      ) {

        return {

          id:
            'g4_' +
            (
              index +
              1
            ),

          prompt:
            row[
              0
            ],

          answer:
            row[
              1
            ],

          ja:
            row[
              2
            ]

        };

      }


      return {

        id:
          'g' +
          state.grade +
          '_' +
          (
            index +
            1
          ),

        prompt:
          row[
            0
          ],

        answer:
          row[
            0
          ],

        ja:
          row[
            1
          ]

      };

    }
  );

}

function renderQuiz(
  item,
  progress
) {

  const choices =
    makeChoices(
      item
    );


  screen.innerHTML = `

    ${progress}

    <section class="card center">

      <div class="lessonEmoji">
        🎯
      </div>

      <div class="title">
        3たくクイズ
      </div>

      <button
        class="secondary"
        onclick="
          speakEnglish(
            '${escapeJs(
              item.prompt
            )}',
            false
          )
        "
      >
        🔊 もんだいを きく
      </button>

      <div class="choices">

        ${
          choices
            .map(
              value => `

                <button
                  class="choice"
                  onclick="
                    answerQuiz(
                      '${escapeJs(
                        value
                      )}',
                      '${escapeJs(
                        item.answer
                      )}'
                    )
                  "
                >
                  ${escapeHtml(
                    value
                  )}
                </button>

              `
            )
            .join('')
        }

      </div>

      ${voiceHtml()}

    </section>

  `;

}


function makeChoices(
  item
) {

  const all =
    getProblems()
      .map(
        value =>
          value.answer
      )
      .filter(
        value =>
          normalize(
            value
          ) !==
          normalize(
            item.answer
          )
      );


  return shuffle(
    [
      item.answer,

      ...shuffle(
        all
      )
      .slice(
        0,
        2
      )
    ]
  );

}


function answerQuiz(
  selected,
  answer
) {

  if (
    normalize(
      selected
    ) !==
    normalize(
      answer
    )
  ) {

    feedback(
      'もう一度やってみよう！',
      false
    );

    return;

  }


  addPoints(
    5
  );


  feedback(
    'せいかい！',
    true
  );


  setTimeout(
    nextPractice,
    400
  );

}

/* ======================================================
   TEXT TO SPEECH
====================================================== */

function speakEnglish(
  text,
  slow
) {

  if (
    !window
      .speechSynthesis
  ) {

    showToast(
      'このブラウザでは音声再生が使えません'
    );

    return;

  }


  stopRecognition();


  const serial =
    ++speakSerial;


  const synth =
    window
      .speechSynthesis;


  try {

    synth.resume();

  }

  catch (error) {}


  const play =
    () => {

      if (
        serial !==
        speakSerial
      ) {

        return;

      }


      const utterance =
        new SpeechSynthesisUtterance(
          String(
            text
          )
        );


      utteranceRef =
        utterance;


      utterance.lang =
        'en-US';


      utterance.rate =
        slow
          ? .67
          : .82;


      utterance.pitch =
        1.02;


      utterance.volume =
        1;


      utterance.onend =
        () => {

          lastSpeechEndedAt =
            Date.now();


          if (
            utteranceRef ===
            utterance
          ) {

            utteranceRef =
              null;

          }

        };


      utterance.onerror =
        () => {

          lastSpeechEndedAt =
            Date.now();

        };


      try {

        synth.speak(
          utterance
        );

      }

      catch (error) {

        showToast(
          'もう一度「きく」を押してね'
        );

      }

    };


  if (
    synth.speaking ||
    synth.pending
  ) {

    synth.cancel();


    setTimeout(
      play,
      100
    );

  }

  else {

    play();

  }

}


function stopSpeech() {

  if (
    window
      .speechSynthesis
  ) {

    try {

      window
        .speechSynthesis
        .cancel();

    }

    catch (error) {}

  }


  lastSpeechEndedAt =
    Date.now();

}


/* ======================================================
   IOS MIC STABILIZER
====================================================== */

const sleep =
  milliseconds =>
    new Promise(
      resolve =>
        setTimeout(
          resolve,
          milliseconds
        )
    );


async function primeMicForIOS() {

  if (
    !isIOS ||
    !navigator
      .mediaDevices
      ?.getUserMedia
  ) {

    return;

  }


  let stream =
    null;


  try {

    setMicPreparing(
      true,
      'マイクを準備中…'
    );


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: {
            echoCancellation:
              true,

            noiseSuppression:
              true,

            autoGainControl:
              true
          }
        });


    await sleep(
      180
    );

  }

  catch (error) {

    console.log(
      'mic prime:',
      error
    );

  }

  finally {

    if (
      stream
    ) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }


  await sleep(
    320
  );

}


/* ======================================================
   SPEECH RECOGNITION
====================================================== */

async function recognizeEnglish(
  answers,
  callback
) {

  if (
    state.listening ||
    state.micPreparing
  ) {

    return;

  }


  const Recognition =
    window
      .SpeechRecognition ||
    window
      .webkitSpeechRecognition;


  if (
    !Recognition
  ) {

    showMicHelp(
      'このSafariでは音声認識APIを利用できません。'
    );

    return;

  }


  const allowed =
    (
      answers ||
      []
    )
    .filter(
      Boolean
    );


  if (
    !allowed.length
  ) {

    showToast(
      '答えのデータがありません'
    );

    return;

  }


  stopSpeech();


  const sinceSpeech =
    Date.now() -
    lastSpeechEndedAt;


  if (
    isIOS &&
    sinceSpeech <
    450
  ) {

    setMicPreparing(
      true,
      '音声を切り替え中…'
    );


    await sleep(
      450 -
      sinceSpeech
    );

  }


  if (
    isIOS
  ) {

    await primeMicForIOS();

  }


  setMicPreparing(
    false,
    'タップして英語を話そう'
  );


  startRecognitionAttempt(
    allowed,
    callback,
    0
  );

}


/* ======================================================
   RECOGNITION ATTEMPT
====================================================== */

function startRecognitionAttempt(
  allowed,
  callback,
  retryNo
) {

  const Recognition =
    window
      .SpeechRecognition ||
    window
      .webkitSpeechRecognition;


  const recognition =
    new Recognition();


  state.recognition =
    recognition;


  let gotResult =
    false;


  let ended =
    false;


  recognition.lang =
    'en-US';


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.maxAlternatives =
    5;


  clearTimeout(
    recognitionWatchdog
  );


  recognition.onstart =
    () => {

      state.listening =
        true;


      setMicUI(
        true
      );


      feedback(
        retryNo
          ? 'もう一度きいているよ…'
          : 'きいているよ…',
        true
      );


      recognitionWatchdog =
        setTimeout(
          async () => {

            if (
              gotResult ||
              ended
            ) {

              return;

            }


            try {

              recognition.abort();

            }

            catch (error) {}


            state.listening =
              false;


            setMicUI(
              false
            );


            if (
              retryNo <
              1
            ) {

              feedback(
                'マイクをつなぎ直しているよ…',
                true
              );


              await sleep(
                650
              );


              if (
                isIOS
              ) {

                await primeMicForIOS();

              }


              startRecognitionAttempt(
                allowed,
                callback,
                1
              );

            }

            else {

              state.micFailures++;


              feedback(
                'うまく受け取れなかったよ。もう一度マイクを押してね',
                false
              );


              showFallback();

            }

          },
          7500
        );

    };


  recognition.onspeechend =
    () => {

      setTimeout(
        () => {

          try {

            recognition.stop();

          }

          catch (error) {}

        },
        120
      );

    };


  recognition.onresult =
    event => {

      gotResult =
        true;


      clearTimeout(
        recognitionWatchdog
      );


      let best = {

        spoken:
          '',

        target:
          allowed[
            0
          ],

        score:
          0

      };


      for (
        let i = 0;
        i <
        event.results[
          0
        ].length;
        i++
      ) {

        const spoken =
          event
            .results[
              0
            ][
              i
            ]
            .transcript;


        allowed
          .forEach(
            target => {

              const score =
                similarity(
                  spoken,
                  target
                );


              if (
                score >
                best.score
              ) {

                best = {

                  spoken:
                    spoken,

                  target:
                    target,

                  score:
                    score

                };

              }

            }
          );

      }


      const score =
        Math.round(
          best.score *
          100
        );


      const words =
        normalize(
          best.target
        )
        .split(
          ' '
        )
        .filter(
          Boolean
        )
        .length;


      const threshold =
        words <=
        1
          ? 62
          : 70;


      const success =
        score >=
        threshold;


      showVoice(
        best.spoken,
        score,
        success
      );


      callback({

        spoken:
          best.spoken,

        target:
          best.target,

        score:
          score,

        success:
          success

      });

    };


  recognition.onerror =
    event => {

      clearTimeout(
        recognitionWatchdog
      );


      if (
        event.error ===
        'aborted'
      ) {

        return;

      }


      if (
        event.error ===
          'not-allowed' ||
        event.error ===
          'service-not-allowed'
      ) {

        showMicHelp(
          'マイクの利用が許可されていません。Safariのサイト設定でマイクを「許可」にしてください。'
        );

      }

      else if (
        event.error ===
        'network'
      ) {

        feedback(
          '音声認識サービスに接続できませんでした。もう一度ためしてね',
          false
        );

      }

      else {

        feedback(
          'うまく聞き取れなかったよ。もう一度ためしてね',
          false
        );

      }

    };


  recognition.onend =
    () => {

      ended =
        true;


      clearTimeout(
        recognitionWatchdog
      );


      state.listening =
        false;


      if (
        state.recognition ===
        recognition
      ) {

        state.recognition =
          null;

      }


      setMicUI(
        false
      );


      if (
        !gotResult &&
        retryNo ===
        0
      ) {

        feedback(
          '声が聞こえなかったよ。もう一度マイクを押してね',
          false
        );

      }

    };


  try {

    recognition.start();

  }

  catch (error) {

    clearTimeout(
      recognitionWatchdog
    );


    state.listening =
      false;


    state.recognition =
      null;


    setMicUI(
      false
    );


    feedback(
      'もう一度マイクを押してね',
      false
    );

  }

}


/* ======================================================
   STOP MIC
====================================================== */

function stopRecognition() {

  clearTimeout(
    recognitionWatchdog
  );


  if (
    state.recognition
  ) {

    try {

      state.recognition
        .abort();

    }

    catch (error) {}

  }


  state.recognition =
    null;


  state.listening =

}

/* ======================================================
   TEXT UTILITIES
====================================================== */

function normalize(
  text
) {

  return String(
    text ||
    ''
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9\s]/g,
    ''
  )
  .replace(
    /\s+/g,
    ' '
  )
  .trim();

}


function similarity(
  first,
  second
) {

  const a =
    normalize(
      first
    );


  const b =
    normalize(
      second
    );


  if (
    a ===
    b
  ) {

    return 1;

  }


  if (
    !a ||
    !b
  ) {

    return 0;

  }


  if (
    a.includes(
      b
    ) ||
    b.includes(
      a
    )
  ) {

    return .94;

  }


  const distance =
    levenshtein(
      a,
      b
    );


  return Math.max(
    0,

    1 -
    distance /
    Math.max(
      a.length,
      b.length
    )
  );

}


function levenshtein(
  a,
  b
) {

  const matrix =
    Array.from(
      {
        length:
          b.length +
          1
      },

      () =>
        Array(
          a.length +
          1
        )
        .fill(
          0
        )
    );


  for (
    let row = 0;
    row <=
    b.length;
    row++
  ) {

    matrix[
      row
    ][
      0
    ] =
      row;

  }


  for (
    let column = 0;
    column <=
    a.length;
    column++
  ) {

    matrix[
      0
    ][
      column
    ] =
      column;

  }


  for (
    let row = 1;
    row <=
    b.length;
    row++
  ) {

    for (
      let column = 1;
      column <=
      a.length;
      column++
    ) {

      const cost =
        b[
          row -
          1
        ] ===
        a[
          column -
          1
        ]
          ? 0
          : 1;


      matrix[
        row
      ][
        column
      ] =
        Math.min(

          matrix[
            row -
            1
          ][
            column
          ] +
          1,

          matrix[
            row
          ][
            column -
            1
          ] +
          1,

          matrix[
            row -
            1
          ][
            column -
            1
          ] +
          cost

        );

    }

  }


  return matrix[
    b.length
  ][
    a.length
  ];

}


function shuffle(
  input
) {

  const array =
    [
      ...input
    ];


  for (
    let i =
      array.length -
      1;
    i >
    0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (
          i +
          1
        )
      );


    [
      array[
        i
      ],
      array[
        j
      ]
    ] = [
      array[
        j
      ],
      array[
        i
      ]
    ];

  }


  return array;

}


function escapeHtml(
  text
) {

  return String(
    text ||
    ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  );

}


function escapeJs(
  text
) {

  return String(
    text ||
    ''
  )
  .replace(
    /\\/g,
    '\\\\'
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\r?\n/g,
    ' '
  );

}

</script>
