<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9e9">
<title>えいごトーク！</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --text:#49382f;
  --sub:#75665d;
  --paper:#fffdf8;
  --line:#decbb5;

  --green:#c8efd5;
  --green-dark:#5a9a70;

  --blue:#d9f1fb;
  --blue-dark:#5d95ad;

  --pink:#f7d9e3;
  --pink-dark:#b36d82;

  --yellow:#f8e49e;
  --orange:#f3a04d;

  --nav-height:84px;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Maru Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  color:var(--text);
  background:#f3efe5;

  font-size:17px;

  -webkit-text-size-adjust:100%;
}

body{
  overflow-x:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

button:disabled{
  opacity:.55;
}

#app{
  position:relative;

  width:100%;
  max-width:480px;
  min-height:100dvh;

  margin:auto;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 8% 11%,
      rgba(255,255,255,.88) 0 23px,
      transparent 24px
    ),
    radial-gradient(
      circle at 18% 11%,
      rgba(255,255,255,.82) 0 32px,
      transparent 33px
    ),
    radial-gradient(
      circle at 91% 20%,
      rgba(255,255,255,.85) 0 30px,
      transparent 31px
    ),
    radial-gradient(
      circle at 78% 20%,
      rgba(255,255,255,.78) 0 20px,
      transparent 21px
    ),
    linear-gradient(
      180deg,
      #cfeeff 0%,
      #eaf9f4 53%,
      #e1f3c5 78%,
      #f7f0dd 100%
    );
}

header{
  position:sticky;
  top:0;
  z-index:100;

  min-height:70px;

  padding:
    calc(8px + env(safe-area-inset-top))
    13px
    8px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(255,250,239,.97);

  border-bottom:2px solid rgba(90,65,47,.12);

  backdrop-filter:blur(10px);
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:21px;
  font-weight:900;
}

.brandArt{
  width:45px;
  height:45px;
  flex:0 0 45px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:7px;
}

.headerBtn{
  min-height:46px;
  min-width:50px;

  padding:6px 12px;

  border:3px solid #e2cfb9;
  border-radius:999px;

  background:#fff;

  color:var(--text);

  font-weight:900;
}

.profileButton{
  width:49px;
  height:49px;

  padding:3px;

  overflow:hidden;
}

.profileButton svg{
  width:100%;
  height:100%;
}

main{
  position:relative;
  z-index:2;

  padding:
    14px
    13px
    calc(
      var(--nav-height)
      + 30px
      + env(safe-area-inset-bottom)
    );
}

.card{
  width:100%;

  margin-bottom:14px;

  padding:20px 16px;

  border:3px solid var(--line);

  border-radius:28px;

  background:rgba(255,253,248,.96);

  box-shadow:
    0 6px 0 rgba(88,64,45,.10);

  backdrop-filter:blur(4px);
}

.center{
  text-align:center;
}

.heroArt{
  display:block;

  width:142px;
  height:142px;

  margin:0 auto 4px;

  filter:
    drop-shadow(
      0 7px 6px
      rgba(88,64,45,.10)
    );
}

.lessonArt{
  display:block;

  width:110px;
  height:110px;

  margin:0 auto 4px;
}

.resultArt{
  width:105px;
  height:105px;

  margin:0 auto 4px;
}

.title{
  margin:9px 0 7px;

  font-size:27px;
  font-weight:900;

  line-height:1.35;
}

.sub{
  color:var(--sub);

  font-size:16px;
  font-weight:700;

  line-height:1.6;
}

.english{
  margin:18px 0 6px;

  color:#28627f;

  font-size:41px;
  font-weight:900;

  line-height:1.15;
}

.japanese{
  margin-bottom:14px;

  color:var(--sub);

  font-size:21px;
  font-weight:900;
}

.prompt{
  margin:17px 0;

  padding:17px;

  border:3px solid #d0aa4f;

  border-radius:22px;

  background:#fff0ba;

  font-size:22px;
  font-weight:900;

  line-height:1.5;
}

.primary,
.secondary,
.plain{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  font-weight:900;
}

.primary{
  min-height:68px;

  margin-top:15px;

  border:3px solid var(--green-dark);

  border-radius:22px;

  background:var(--green);

  color:#31553e;

  box-shadow:0 5px 0 #7bb68c;

  font-size:20px;
}

.secondary{
  min-height:61px;

  margin-top:11px;

  border:3px solid var(--blue-dark);

  border-radius:21px;

  background:var(--blue);

  color:#315a70;

  font-size:19px;
}

.plain{
  min-height:57px;

  margin-top:10px;

  border:3px solid #dbc8b5;

  border-radius:20px;

  background:#fff;

  color:var(--text);

  font-size:17px;
}

.stats{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;

  margin-bottom:15px;
}

.stat{
  padding:14px 8px;

  border:3px solid #876955;

  border-radius:24px;

  background:rgba(255,255,255,.96);

  text-align:center;
}

.statArt{
  width:49px;
  height:49px;

  margin:auto;
}

.statValue{
  font-size:37px;
  font-weight:900;
}

.statLabel{
  color:var(--sub);

  font-size:14px;
  font-weight:900;
}

.menu{
  display:grid;
  gap:11px;
}

.menuBtn{
  width:100%;

  min-height:95px;

  padding:12px;

  display:grid;

  grid-template-columns:
    62px
    minmax(0,1fr)
    20px;

  gap:10px;

  align-items:center;

  border:3px solid #dac8b7;

  border-radius:23px;

  background:rgba(255,255,255,.97);

  text-align:left;
}

.menuIcon{
  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:#fff2c8;
}

.menuIcon svg{
  width:52px;
  height:52px;
}

.menuTitle{
  font-size:19px;
  font-weight:900;
}

.menuText{
  margin-top:3px;

  color:var(--sub);

  font-size:14px;
  font-weight:700;
}

.arrow{
  font-size:28px;
  color:#9e8878;
}

.training{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;
}

.trainingBtn{
  min-height:158px;

  padding:13px 7px;

  border:3px solid #dbc8b6;

  border-radius:24px;

  background:rgba(255,255,255,.97);

  text-align:center;
}

.trainingIcon{
  width:78px;
  height:78px;

  margin:auto;
}

.trainingTitle{
  margin-top:5px;

  font-size:19px;
  font-weight:900;
}

.trainingText{
  margin-top:3px;

  color:var(--sub);

  font-size:13px;
  font-weight:700;
}

.progressCard{
  margin-bottom:13px;

  padding:12px 14px;

  border:3px solid rgba(100,70,50,.17);

  border-radius:20px;

  background:rgba(255,253,248,.97);
}

.progress{
  height:13px;

  overflow:hidden;

  border-radius:999px;

  background:#e7ddd2;
}

.progressFill{
  height:100%;

  background:
    linear-gradient(
      90deg,
      #efc64e,
      #e9a5b7
    );
}

.progressText{
  margin-top:5px;

  text-align:right;

  color:var(--sub);

  font-size:14px;
  font-weight:900;
}

.micArea{
  margin:23px 0 15px;

  text-align:center;
}

.mic{
  width:138px;
  height:138px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:4px solid var(--pink-dark);

  border-radius:50%;

  background:var(--pink);

  box-shadow:
    0 8px 0 #c9879a;
}

.mic svg{
  width:88px;
  height:88px;
}

.mic.listening{
  animation:
    pulse
    .6s
    infinite
    alternate;
}

.mic.preparing{
  animation:
    pulse
    .9s
    infinite
    alternate;

  background:#f8e5b8;
}

@keyframes pulse{
  to{
    transform:scale(1.07);
  }
}

.micText{
  margin-top:13px;

  color:var(--sub);

  font-size:16px;
  font-weight:900;
}

.voiceResult{
  min-height:100px;

  margin-top:14px;

  padding:14px;

  border:3px solid #b8dce9;

  border-radius:20px;

  background:#effaff;

  color:#416a7c;

  font-weight:800;

  text-align:center;
}

.feedback{
  display:none;

  margin-top:12px;

  padding:13px;

  border-radius:18px;

  font-size:16px;
  font-weight:900;
}

.feedback.good{
  display:block;

  background:#e1f5e8;

  border:2px solid #96d2aa;

  color:#315d40;
}

.feedback.retry{
  display:block;

  background:#fff0d4;

  border:2px solid #e2bd74;

  color:#76501e;
}

.choices{
  display:grid;

  gap:11px;

  margin-top:15px;
}

.choice{
  min-height:73px;

  padding:11px;

  border:3px solid #80b2c8;

  border-radius:21px;

  background:#edf9fd;

  color:#315d74;

  font-size:21px;
  font-weight:900;
}

.fallback{
  display:none;

  margin-top:10px;

  padding:12px;

  border:2px dashed #c9a973;

  border-radius:17px;

  background:#fff9e9;
}

.fallback.show{
  display:block;
}

.fallbackText{
  font-size:14px;

  color:#776351;

  font-weight:700;

  line-height:1.5;
}

nav{
  position:fixed;

  left:50%;
  bottom:0;

  transform:translateX(-50%);

  z-index:200;

  width:100%;
  max-width:480px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:4px;

  padding:
    6px
    6px
    calc(
      6px
      + env(safe-area-inset-bottom)
    );

  border-top:2px solid #dfcdb9;

  background:rgba(255,250,240,.98);

  backdrop-filter:blur(12px);
}

.navBtn{
  min-height:74px;

  border-radius:18px;

  background:transparent;

  color:#65574e;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  font-size:12px;
  font-weight:900;
}

.navIcon{
  width:34px;
  height:34px;
}

.navBtn.active{
  background:#f6e3a1;

  color:#714e18;
}

.modal{
  display:none;

  position:fixed;
  inset:0;

  z-index:1000;

  padding:14px;

  background:
    rgba(
      48,
      37,
      30,
      .54
    );

  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:420px;

  padding:22px 16px;

  border:4px solid #896854;

  border-radius:27px;

  background:#fffdf8;

  text-align:center;
}

.profileArt{
  width:110px;
  height:110px;

  margin:auto;
}

.field{
  width:100%;

  min-height:58px;

  margin:7px 0;

  padding:12px;

  border:3px solid #d8c5b2;

  border-radius:17px;

  background:#fff;

  font-size:18px;
  font-weight:800;
}

.notice{
  margin-top:12px;

  padding:13px;

  border-radius:18px;

  background:#eef9fd;

  color:#426776;

  text-align:left;

  font-size:14px;
  font-weight:700;

  line-height:1.65;
}

#toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      var(--nav-height)
      + 23px
      + env(safe-area-inset-bottom)
    );

  transform:translateX(-50%);

  z-index:2000;

  width:calc(100% - 30px);
  max-width:410px;

  padding:12px;

  border-radius:17px;

  background:rgba(65,51,42,.95);

  color:#fff;

  text-align:center;

  font-size:15px;
  font-weight:900;

  opacity:0;

  pointer-events:none;

  transition:opacity .18s;
}

#toast.show{
  opacity:1;
}

svg{
  overflow:visible;
}

@media(max-width:360px){
  .title{
    font-size:24px;
  }

  .english{
    font-size:37px;
  }

  .trainingBtn{
    min-height:150px;
  }
}
</style>
</head>

<body>

<div id="app">

<header>

  <div class="brand">

    <div
      id="brandArt"
      class="brandArt"
    ></div>

    <span>
      えいごトーク！
    </span>

  </div>

  <div class="headerRight">

    <button
      id="gradeBtn"
      class="headerBtn"
      onclick="openProfile()"
    >
      1ねん
    </button>

    <button
      class="headerBtn profileButton"
      onclick="openProfile()"
      aria-label="プロフィール"
    >

      <span id="headerProfileArt"></span>

    </button>

  </div>

</header>

<main id="screen"></main>

<nav>

  <button
    id="navHome"
    class="navBtn active"
    onclick="go('home')"
  >

    <span
      id="navHomeArt"
      class="navIcon"
    ></span>

    きょう
  </button>

  <button
    id="navTrain"
    class="navBtn"
    onclick="go('train')"
  >

    <span
      id="navTrainArt"
      class="navIcon"
    ></span>

    れんしゅう
  </button>

  <button
    id="navTalk"
    class="navBtn"
    onclick="go('talk')"
  >

    <span
      id="navTalkArt"
      class="navIcon"
    ></span>

    かいわ
  </button>

  <button
    id="navReward"
    class="navBtn"
    onclick="go('reward')"
  >

    <span
      id="navRewardArt"
      class="navIcon"
    ></span>

    ごほうび
  </button>

</nav>

</div>

<div id="toast"></div>

<div
  id="profileModal"
  class="modal"
>

  <div class="modalBox">

    <div
      id="profileArt"
      class="profileArt"
    ></div>

    <div class="title">
      プレイヤー
    </div>

    <input
      id="nameInput"
      class="field"
      maxlength="20"
      placeholder="ニックネーム"
    >

    <select
      id="gradeInput"
      class="field"
    >

      <option value="1">
        1ねん
      </option>

      <option value="2">
        2ねん
      </option>

      <option value="3">
        3ねん
      </option>

      <option value="4">
        4ねん
      </option>

    </select>

    <button
      class="primary"
      onclick="saveProfile()"
    >
      ✓ ほぞん
    </button>

    <button
      class="plain"
      onclick="closeModal('profileModal')"
    >
      とじる
    </button>

  </div>

</div>

<div
  id="micHelpModal"
  class="modal"
>

  <div class="modalBox">

    <div
      id="micHelpArt"
      class="profileArt"
    ></div>

    <div class="title">
      マイクについて
    </div>

    <div
      id="micHelpText"
      class="notice"
    ></div>

    <button
      class="primary"
      onclick="closeModal('micHelpModal')"
    >
      わかった
    </button>

  </div>

</div>

<script>

/* =====================================================
   SVGイラスト
   外部画像を一切使わない1ファイル完結版
===================================================== */

function svgWrap(
  body,
  className = '',
  label = ''
){

  return `
    <svg
      class="${className}"
      viewBox="0 0 120 120"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="${escapeHtml(label)}"
    >
      ${body}
    </svg>
  `;
}

function chickBase(){

  return `
    <ellipse
      cx="60"
      cy="66"
      rx="35"
      ry="38"
      fill="#FFD94F"
      stroke="#8C5A1F"
      stroke-width="3"
    />

    <circle
      cx="60"
      cy="39"
      r="28"
      fill="#FFE566"
      stroke="#8C5A1F"
      stroke-width="3"
    />

    <path
      d="M55 13
         C57 5 64 5 66 13
         C70 8 76 11 72 18"
      fill="#FFE566"
      stroke="#8C5A1F"
      stroke-width="3"
      stroke-linecap="round"
    />

    <ellipse
      cx="31"
      cy="67"
      rx="14"
      ry="20"
      fill="#FFE566"
      stroke="#8C5A1F"
      stroke-width="3"
      transform="rotate(-20 31 67)"
    />

    <ellipse
      cx="89"
      cy="67"
      rx="14"
      ry="20"
      fill="#FFE566"
      stroke="#8C5A1F"
      stroke-width="3"
      transform="rotate(20 89 67)"
    />

    <circle
      cx="49"
      cy="37"
      r="4"
      fill="#3C2517"
    />

    <circle
      cx="71"
      cy="37"
      r="4"
      fill="#3C2517"
    />

    <ellipse
      cx="42"
      cy="49"
      rx="7"
      ry="4"
      fill="#F6A1A0"
      opacity=".85"
    />

    <ellipse
      cx="78"
      cy="49"
      rx="7"
      ry="4"
      fill="#F6A1A0"
      opacity=".85"
    />

    <path
      d="M53 46 L67 46 L60 55 Z"
      fill="#F7941D"
      stroke="#B85D0C"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <path
      d="M52 59
         Q60 68 68 59"
      fill="none"
      stroke="#623519"
      stroke-width="3"
      stroke-linecap="round"
    />

    <path
      d="M43 104
         q-9 7 -17 1"
      fill="none"
      stroke="#E67E13"
      stroke-width="5"
      stroke-linecap="round"
    />

    <path
      d="M77 104
         q9 7 17 1"
      fill="none"
      stroke="#E67E13"
      stroke-width="5"
      stroke-linecap="round"
    />
  `;
}

function bearBase(){

  return `
    <circle
      cx="38"
      cy="28"
      r="12"
      fill="#A96C45"
      stroke="#65402D"
      stroke-width="3"
    />

    <circle
      cx="82"
      cy="28"
      r="12"
      fill="#A96C45"
      stroke="#65402D"
      stroke-width="3"
    />

    <circle
      cx="60"
      cy="48"
      r="34"
      fill="#B87850"
      stroke="#65402D"
      stroke-width="3"
    />

    <ellipse
      cx="60"
      cy="81"
      rx="35"
      ry="31"
      fill="#6FA9E4"
      stroke="#65402D"
      stroke-width="3"
    />

    <ellipse
      cx="60"
      cy="55"
      rx="18"
      ry="15"
      fill="#F7E2D0"
    />

    <circle
      cx="49"
      cy="43"
      r="4"
      fill="#3A2419"
    />

    <circle
      cx="71"
      cy="43"
      r="4"
      fill="#3A2419"
    />

    <ellipse
      cx="60"
      cy="51"
      rx="5"
      ry="4"
      fill="#3A2419"
    />

    <path
      d="M51 57
         Q60 67 69 57"
      fill="none"
      stroke="#3A2419"
      stroke-width="3"
      stroke-linecap="round"
    />

    <ellipse
      cx="42"
      cy="57"
      rx="7"
      ry="4"
      fill="#F29A9A"
    />

    <ellipse
      cx="78"
      cy="57"
      rx="7"
      ry="4"
      fill="#F29A9A"
    />

    <path
      d="M52 68
         L60 76
         L68 68
         L68 82
         L60 76
         L52 82
         Z"
      fill="#225FA9"
      stroke="#184A84"
      stroke-width="2"
    />
  `;
}

function art(
  name,
  className = '',
  label = ''
){

  if(name === 'mascot'){

    return svgWrap(
      `
        ${chickBase()}

        <path
          d="M26 60
             Q13 49 12 34"
          fill="none"
          stroke="#8C5A1F"
          stroke-width="3"
          stroke-linecap="round"
        />

        <path
          d="M14 33
             q-9 -4 -10 -12"
          fill="none"
          stroke="#F2A51A"
          stroke-width="5"
          stroke-linecap="round"
        />

        <path
          d="M19 29
             q-2 -10 4 -15"
          fill="none"

function loadState(){

      JSON.parse(
        localStorage.getItem(
          'eigoTalkState'
        )||
        '{}'
      );

    state={
      ...state,
      ...saved,

      recognition:null,

      listening:false,

      micPreparing:false,

      micFailures:0
    };

  }catch(error){}
}

function saveState(){

  const copy={
    ...state
  };

  delete copy.recognition;

  delete copy.listening;

  delete copy.micPreparing;

  delete copy.micFailures;

  localStorage.setItem(
    'eigoTalkState',
    JSON.stringify(
      copy
    )
  );
}

      'ねん';

function go(page){

  stopRecognition();

  clearTimeout(
    transitionTimer
  );

  state.page=
    page;

  if(
    page!==
    'talk'
  ){
    state.mission=null;
  }

  saveState();

  document
    .querySelectorAll(
      '.navBtn'
    )
    .forEach(
      element=>{

        element
          .classList
          .remove(
            'active'
          );
      }
    );

  const ids={

    home:'navHome',

    train:'navTrain',

    talk:'navTalk',

    reward:'navReward'
  };

  if(
    ids[
      page
    ]
  ){

    document
      .getElementById(
        ids[
          page
        ]
      )
      .classList
      .add(
        'active'
      );
  }

  window.scrollTo(
    0,
    0
  );

  if(
    page===
    'home'
  ){
    renderHome();
  }

  if(
    page===
    'train'
  ){
    renderTraining();
  }

  if(
    page===
    'talk'
  ){
    state.mission=null;
    renderMissionList();
  }

  if(
    page===
    'reward'
  ){
    renderReward();
  }
}

function getProblems(){

  const rows=
    WORDS[
      state.grade
    ]||
    [];

  return rows.map(
    (
      row,
      index
    )=>{

      if(
        state.grade===
        4
      ){

        return{

          id:
            'g4_'+
            (
              index+
              1
            ),

          prompt:
            row[
              0
            ],

          answer:
            row[
              1
            ],

          ja:
            row[
              2
            ]
        };
      }

      return{

        id:
          'g'+
          state.grade+
          '_'+
          (
            index+
            1
          ),

        prompt:
          row[
            0
          ],

        answer:
          row[
            0
          ],

        ja:
          row[
            1
          ]
      };
    }
  );
}

function renderQuiz(
  item,
  progress
){

  const choices=
    makeChoices(
      item
    );

  screen.innerHTML=`

    ${progress}

    <section class="card center">

      ${art(
        'quiz',
        'lessonArt',
        'クイズ'
      )}

      <div class="title">
        3たくクイズ
      </div>

      <button
        class="secondary"
        onclick="
          speakEnglish(
            '${escapeJs(
              item.prompt
            )}',
            false
          )
        "
      >
        🔊 もんだいを きく
      </button>

      <div class="choices">

        ${
          choices
            .map(
              value=>`

                <button
                  class="choice"
                  onclick="
                    answerQuiz(
                      '${escapeJs(
                        value
                      )}',
                      '${escapeJs(
                        item.answer
                      )}'
                    )
                  "
                >

                  ${escapeHtml(
                    value
                  )}

                </button>
              `
            )
            .join('')
        }

      </div>

      <div
        id="feedback"
        class="feedback"
      ></div>

    </section>
  `;
}

function makeChoices(
  item
){

  const all=
    getProblems()
      .map(
        value=>
          value.answer
      )
      .filter(
        value=>
          normalize(
            value
          )!==
          normalize(
            item.answer
          )
      );

  return shuffle([
    item.answer,
    ...shuffle(
      all
    )
    .slice(
      0,
      2
    )
  ]);
}

function answerQuiz(
  selected,
  answer
){

  if(
    normalize(
      selected
    )!==
    normalize(
      answer
    )
  ){

    feedback(
      '💪 おしい！ もう一回えらんでみよう',
      false
    );

    return;
  }

  addPoints(
    5
  );

  feedback(
    '🌟 せいかい！',
    true
  );

  transitionTimer=
    setTimeout(
      nextPractice,
      1500
    );
}

function speakEnglish(
  text,
  slow
){

  if(
    !window
      .speechSynthesis
  ){

    showToast(
      'このブラウザでは音声再生が使えません'
    );

    return;
  }

  stopRecognition();

  const serial=
    ++speakSerial;

  const synth=
    window
      .speechSynthesis;

  try{
    synth.resume();
  }catch(error){}

  const play=()=>{

    if(
      serial!==
      speakSerial
    ){
      return;
    }

    const utterance=
      new SpeechSynthesisUtterance(
        String(
          text
        )
      );

    utteranceRef=
      utterance;

    utterance.lang=
      'en-US';

    utterance.rate=
      slow
      ? .67
      : .82;

    utterance.pitch=
      1.02;

    utterance.volume=
      1;

    utterance.onend=()=>{

      lastSpeechEndedAt=
        Date.now();

      if(
        utteranceRef===
        utterance
      ){
        utteranceRef=null;
      }
    };

    utterance.onerror=()=>{

      lastSpeechEndedAt=
        Date.now();
    };

    try{

      synth.speak(
        utterance
      );

    }catch(error){

      showToast(
        'もう一度「きく」を押してね'
      );
    }
  };

  if(
    synth.speaking||
    synth.pending
  ){

    synth.cancel();

    setTimeout(
      play,
      100
    );

  }else{

    play();
  }
}

function stopSpeech(){

  if(
    window
      .speechSynthesis
  ){

    try{

      window
        .speechSynthesis
        .cancel();

    }catch(error){}
  }

  lastSpeechEndedAt=
    Date.now();
}

/* =====================================================
   iPhoneマイク対策
===================================================== */

const sleep=
  milliseconds=>
    new Promise(
      resolve=>
        setTimeout(
          resolve,
          milliseconds
        )
    );

async function primeMicForIOS(){

  if(
    !isIOS||
    !navigator
      .mediaDevices
      ?.getUserMedia
  ){
    return;
  }

  let stream=null;

  try{

    setMicPreparing(
      true,
      'マイクを準備中…'
    );

    stream=
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }
        });

    await sleep(
      180
    );

  }catch(error){

    console.log(
      'mic prime:',
      error
    );

  }finally{

    if(
      stream
    ){

      stream
        .getTracks()
        .forEach(
          track=>
            track.stop()
        );
    }
  }

  await sleep(
    320
  );
}

async function recognizeEnglish(
  answers,
  callback
){

  if(
    state.listening||
    state.micPreparing
  ){
    return;
  }

  const Recognition=
    window
      .SpeechRecognition||
    window
      .webkitSpeechRecognition;

  if(
    !Recognition
  ){

    showMicHelp(
      'このSafariでは音声認識を利用できません。'
    );

    return;
  }

  const allowed=
    (
      answers||
      []
    )
    .filter(
      Boolean
    );

  if(
    !allowed.length
  ){

    showToast(
      '答えのデータがありません'
    );

    return;
  }

  stopSpeech();

  const sinceSpeech=
    Date.now()-
    lastSpeechEndedAt;

  if(
    isIOS&&
    sinceSpeech<
    450
  ){

    setMicPreparing(
      true,
      '音声を切り替え中…'
    );

    await sleep(
      450-
      sinceSpeech
    );
  }

  if(
    isIOS
  ){

    await primeMicForIOS();
  }

  setMicPreparing(
    false,
    'タップして英語を話そう'
  );

  startRecognitionAttempt(
    allowed,
    callback,
    0
  );
}

function startRecognitionAttempt(
  allowed,
  callback,
  retryNo
){

  const Recognition=
    window
      .SpeechRecognition||
    window
      .webkitSpeechRecognition;

  const recognition=
    new Recognition();

  state.recognition=
    recognition;

  let gotResult=false;

  let ended=false;

  recognition.lang=
    'en-US';

  recognition.interimResults=
    false;

  recognition.continuous=
    false;

  recognition.maxAlternatives=
    5;

  clearTimeout(
    recognitionWatchdog
  );

  recognition.onstart=()=>{

    state.listening=
      true;

    setMicUI(
      true
    );

    feedback(
      retryNo
      ? '🎤 もう一度きいているよ…'
      : '🎤 きいているよ…',
      true
    );

    recognitionWatchdog=
      setTimeout(
        async()=>{

          if(
            gotResult||
            ended
          ){
            return;
          }

          try{

            recognition.abort();

          }catch(error){}

          state.listening=
            false;

          setMicUI(
            false
          );

          if(
            retryNo<
            1
          ){

            feedback(
              '🎤 マイクをつなぎ直しているよ…',
              true
            );

            await sleep(
              650
            );

            if(
              isIOS
            ){

              await primeMicForIOS();
            }

            startRecognitionAttempt(
              allowed,
              callback,
              1
            );

          }else{

            state.micFailures++;

            feedback(
              'うまく受け取れなかったよ。もう一度マイクを押してね',
              false
            );

            showFallback();
          }
        },
        7500
      );
  };

  recognition.onspeechend=()=>{

    setTimeout(
      ()=>{

        try{

          recognition.stop();

        }catch(error){}
      },
      120
    );
  };

  recognition.onresult=
    event=>{

      gotResult=
        true;

      clearTimeout(
        recognitionWatchdog
      );

      let best={

        spoken:'',

        target:
          allowed[
            0
          ],

        score:0
      };

      for(
        let index=0;
        index<
        event.results[
          0
        ].length;
        index++
      ){

        const spoken=
          event
            .results[
              0
            ][
              index
            ]
            .transcript;

        allowed
          .forEach(
            target=>{

              const score=
                similarity(
                  spoken,
                  target
                );

              if(
                score>
                best.score
              ){

                best={

                  spoken:
                    spoken,

                  target:
                    target,

                  score:
                    score
                };
              }
            }
          );
      }

      const score=
        Math.round(
          best.score*
          100
        );

      const wordCount=
        normalize(
          best.target
        )
        .split(
          ' '
        )
        .filter(
          Boolean
        )
        .length;

      const threshold=
        wordCount<=
        1
        ? 62
        : 70;

      const success=
        score>=
        threshold;

      showVoice(
        best.spoken,
        score,
        success
      );

      callback({

        spoken:
          best.spoken,

        target:
          best.target,

        score:
          score,

        success:
          success
      });
    };

  recognition.onerror=
    event=>{

      clearTimeout(
        recognitionWatchdog
      );

      if(
        event.error===
        'aborted'
      ){
        return;
      }

      if(
        event.error===
          'not-allowed'||
        event.error===
          'service-not-allowed'
      ){

        showMicHelp(
          'マイクの利用が許可されていません。Safariのサイト設定でマイクを「許可」にしてください。'
        );

      }else if(
        event.error===
        'network'
      ){

        feedback(
          '音声認識サービスに接続できませんでした。もう一度ためしてね',
          false
        );

      }else{

        feedback(
          'うまく聞き取れなかったよ。もう一度ためしてね',
          false
        );
      }
    };

  recognition.onend=()=>{

    ended=
      true;

    clearTimeout(
      recognitionWatchdog
    );

    state.listening=
      false;

    if(
      state.recognition===
      recognition
    ){

      state.recognition=
        null;
    }

    setMicUI(
      false
    );

    if(
      !gotResult&&
      retryNo===
      0
    ){

      feedback(
        '声が聞こえなかったよ。もう一度マイクを押してね',
        false
      );
    }
  };

  try{

    recognition.start();

  }catch(error){

    clearTimeout(
      recognitionWatchdog
    );

    state.listening=
      false;

    state.recognition=
      null;

    setMicUI(
      false
    );

    feedback(
      'もう一度マイクを押してね',
      false
    );
  }
}

function stopRecognition(){

  clearTimeout(
    recognitionWatchdog
  );

  if(
    state.recognition
  ){

    try{

      state.recognition
        .abort();

    }catch(error){}
  }

  state.recognition=
    null;

  state.listening=
    false;

  state.micPreparing=
    false;
}

function setMicPreparing(
  active,
  text
){

  state.micPreparing=
    active;

  document
    .querySelectorAll(
      '.mic'
    )
    .forEach(
      button=>{

        button
          .classList
          .toggle(
            'preparing',
            active
          );

        button.disabled=
          active;
      }
    );

  const element=
    document
      .querySelector(
        '.micText'
      );

  if(
    element&&
    text

    element.textContent=
      text;
  }
}

function setMicUI(
  active
){

  document
    .querySelectorAll(
      '.mic'
    )
    .forEach(
      button=>{

        button
          .classList
          .toggle(
            'listening',
            active
          );

        button
          .classList
          .remove(
            'preparing'
          );

        button.disabled=
          active;
      }
    );

  const element=
    document
      .querySelector(
        '.micText'
      );

  if(
    element
  ){

    element.textContent=
      active
      ? '英語を話してね'
      : 'タップして英語を話そう';
  }
}

function normalize(
  text
){

  return String(
    text||
    ''
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9\s]/g,
    ''
  )
  .replace(
    /\s+/g,
    ' '
  )
  .trim();
}

function similarity(
  first,
  second
){

  const a=
    normalize(
      first
    );

  const b=
    normalize(
      second
    );

  if(
    a===
    b
  ){
    return 1;
  }

  if(
    !a||
    !b
  ){
    return 0;
  }

  if(
    a.includes(
      b
    )||
    b.includes(
      a
    )
  ){
    return .94;
  }

  const distance=
    levenshtein(
      a,
      b
    );

  return Math.max(
    0,
    1-
    distance/
    Math.max(
      a.length,
      b.length
    )
  );
}

function levenshtein(
  a,
  b
){

  const matrix=
    Array.from(
      {
        length:
          b.length+
          1
      },
      ()=>
        Array(
          a.length+
          1
        )
        .fill(
          0
        )
    );

  for(
    let row=0;
    row<=
    b.length;
    row++
  ){

    matrix[
      row
    ][
      0
    ]=
      row;
  }

  for(
    let column=0;
    column<=
    a.length;
    column++
  ){

    matrix[
      0
    ][
      column
    ]=
      column;
  }

  for(
    let row=1;
    row<=
    b.length;
    row++
  ){

    for(
      let column=1;
      column<=
      a.length;
      column++
    ){

      const cost=
        b[
          row-
          1
        ]===
        a[
          column-
          1
        ]
        ? 0
        : 1;

      matrix[
        row
      ][
        column
      ]=
        Math.min(

          matrix[
            row-
            1
          ][
            column
          ]+
          1,

          matrix[
            row
          ][
            column-
            1
          ]+
          1,

          matrix[
            row-
            1
          ][
            column-
            1
          ]+
          cost
        );
    }
  }

  return matrix[
    b.length
  ][
    a.length
  ];
}

function shuffle(
  input
){

  const array=[
    ...input
  ];

  for(
    let index=
      array.length-
      1;
    index>
    0;
    index--
  ){

    const randomIndex=
      Math.floor(
        Math.random()*
        (
          index+
          1
        )
      );

    [
      array[
        index
      ],
      array[
        randomIndex
      ]
    ]=[
      array[
        randomIndex
      ],
      array[
        index
      ]
    ];
  }

  return array;
}

function escapeHtml(
  text
){

  return String(
    text||
    ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  );
}

function escapeJs(
  text
){

  return String(
    text||
    ''
  )
  .replace(
    /\\/g,
    '\\\\'
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\r?\n/g,
    ' '
  );
}
